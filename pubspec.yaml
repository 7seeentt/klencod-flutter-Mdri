name: music_flutter
description: A professional music player built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  audio_service: ^0.18.12
  on_audio_query: ^2.9.0
  permission_handler: ^11.3.0
  flutter_local_notifications: ^17.0.0

flutter:
  uses-material-design: true